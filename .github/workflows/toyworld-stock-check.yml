name: Toyworld Palmerston North Stock Checker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-toyworld:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check Toyworld Palmerston North stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python toyworld_region_check.py

      - name: Save Toyworld stock state
        run: |
          git config user.name "pokemon-stock-bot"
          git config user.email "41988282+github-actions[bot]@users.noreply.github.com"
          git add toyworld_state.json
          git diff --cached --quiet || git commit -m "Update Toyworld stock state"
          git push
